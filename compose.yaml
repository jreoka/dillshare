services:
  dillshare:
    build:
      context: .
    ports:
      # Bound to loopback on purpose: put a TLS-terminating reverse proxy in
      # front of it so session tokens and share keys never travel in clear text.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    env_file:
      - .env
    # The server keeps no local state (everything lives in the bucket), so the
    # container filesystem can stay read-only.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
